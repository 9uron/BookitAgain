{% if form.non_field_errors %}<div class="errors">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<small>{{ field.help_text|safe }}</small>{% endif %}
  {% for e in field.errors %}<div class="err">{{ e }}</div>{% endfor %}
</div>
{% endfor %}
