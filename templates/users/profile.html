{% extends "base.html" %}
{% block title %}Профиль{% endblock %}
{% block content %}
<div class="card auth">
  <div class="center"><span class="avatar xl">{{ user.initial }}</span></div>
  <h1>{{ user.display_name }}</h1>
  <p class="muted center">{{ user.get_role_display }} · @{{ user.username }}</p>
  <form method="post">{% csrf_token %}
    {% include "includes/form.html" %}
    <button class="btn block">Сохранить</button>
  </form>
</div>
{% endblock %}
